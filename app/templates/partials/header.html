<header class="sticky top-0 z-20 flex items-center justify-between h-16 px-4 sm:px-6
               bg-white border-b border-slate-200">
  <div class="flex items-center gap-3">
    <!-- Mobile sidebar toggle -->
    <label for="sidebar-toggle"
           class="lg:hidden inline-flex h-9 w-9 items-center justify-center rounded-lg
                  border border-slate-200 cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </label>
    <h1 class="text-base sm:text-lg font-bold text-slate-800">{% block page_title %}لوحة التحكم{% endblock %}</h1>
  </div>

  <div class="flex items-center gap-3">
    <span class="hidden sm:block text-sm text-slate-500">مرحباً بك</span>
    <span class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-brand-gold/15
                 text-brand-gold font-bold text-sm">JSH</span>
  </div>
</header>
