<header class="sticky top-0 z-20 flex items-center justify-between h-16 px-4 sm:px-6
               bg-white border-b border-slate-200">
  <div class="flex items-center gap-3">
    <!-- Mobile sidebar toggle -->
    <label for="sidebar-toggle"
           class="lg:hidden inline-flex h-9 w-9 items-center justify-center rounded-lg
                  border border-slate-200 cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </label>
    <h1 class="text-base sm:text-lg font-bold text-slate-800">{% block page_title %}لوحة التحكم{% endblock %}</h1>
  </div>

  <div class="flex items-center gap-3">
    {% if current_user.is_authenticated %}
      <div class="hidden sm:flex flex-col items-end leading-tight">
        <span class="text-sm font-medium text-slate-700">{{ current_user.display_name }}</span>
        <span class="text-[11px] text-slate-400">{{ current_user.email }}</span>
      </div>
      <span class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-brand-gold/15
                   text-brand-gold font-bold text-sm">
        {{ current_user.display_name[0] | upper }}
      </span>
      <form method="POST" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <button type="submit"
                class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 px-3 py-1.5
                       text-sm text-slate-600 hover:bg-slate-50 transition">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span class="hidden sm:inline">خروج</span>
        </button>
      </form>
    {% endif %}
  </div>
</header>
