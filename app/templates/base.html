<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ config.APP_NAME_AR }}{% endblock %} — {{ config.ORG_NAME_AR }}</title>

  <!-- Tailwind (Play CDN for the foundation; a build step replaces this before production) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Tajawal', 'sans-serif'] },
          colors: {
            brand: { gold: '#C9A227', dark: '#0f172a' }
          }
        }
      }
    };
  </script>

  <!-- Tajawal Arabic font (matches the previous portal's typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 font-sans antialiased">
  <div class="flex min-h-screen">
    {% include 'partials/sidebar.html' %}

    <div class="flex-1 flex flex-col min-w-0">
      {% include 'partials/header.html' %}

      <main class="flex-1 p-4 sm:p-6 lg:p-8">
        {% block content %}{% endblock %}
      </main>

      <footer class="px-6 py-4 text-center text-xs text-slate-400 border-t border-slate-200">
        {{ config.APP_NAME_AR }} — {{ config.ORG_NAME_AR }}
      </footer>
    </div>
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
