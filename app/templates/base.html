<!DOCTYPE html>
<html lang="{{ current_locale }}" dir="{{ text_direction }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ config.APP_NAME }}{% endblock %} — {{ config.ORG_NAME }}</title>

  <!-- Self-contained, locally built Tailwind + self-hosted Tajawal font (no external CDN) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 font-sans antialiased">
  <div class="flex min-h-screen">
    {% include 'partials/sidebar.html' %}

    <div class="flex-1 flex flex-col min-w-0">
      {% include 'partials/header.html' %}

      <main class="flex-1 p-4 sm:p-6 lg:p-8">
        {% include 'partials/flashes.html' %}
        {% block content %}{% endblock %}
      </main>

      <footer class="px-6 py-4 text-center text-xs text-slate-400 border-t border-slate-200">
        {{ config.APP_NAME }} — {{ config.ORG_NAME }}
      </footer>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
