<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ code }} — {{ config.APP_NAME_AR }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}" />
</head>
<body class="min-h-screen bg-slate-100 font-sans antialiased flex items-center justify-center p-4">
  <div class="w-full max-w-md text-center">
    <span class="inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-brand-gold text-brand-dark text-2xl font-extrabold">ت</span>
    <p class="mt-6 text-5xl font-extrabold text-slate-800 ltr-nums">{{ code }}</p>
    <h1 class="mt-2 text-lg font-bold text-slate-700">{{ title }}</h1>
    <p class="mt-2 text-sm text-slate-500">{{ message }}</p>
    <a href="{{ url_for('main.dashboard') }}"
       class="inline-block mt-6 rounded-lg bg-brand-dark text-white text-sm font-medium px-5 py-2.5 hover:bg-slate-800 transition">
      العودة إلى الصفحة الرئيسية
    </a>
  </div>
</body>
</html>
